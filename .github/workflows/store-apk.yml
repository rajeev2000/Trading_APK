name: Store verified APK in repository
on:
  push:
    branches: [publish/apk-folder-20261105]
permissions:
  contents: write
jobs:
  store-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and verify published APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p APK
          gh release download v0.1.0-preview.20261105 --pattern Trading_APK.apk --dir APK
          echo "45b5aa7af6ff6327504efdfb76bd6f9fbd6d63d38f181cb5d5a1d47322787de3  APK/Trading_APK.apk" | sha256sum --check
      - name: Commit APK folder to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APK/Trading_APK.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add verified Android preview APK to APK folder"
          git push origin HEAD:main
